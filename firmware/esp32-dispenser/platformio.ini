[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The FTDI on the relay board does not auto-reset reliably at 460800.
upload_speed = 115200
monitor_filters = esp32_exception_decoder, color, time
build_flags =
  -D CORE_DEBUG_LEVEL=3
lib_deps =
  ; WebServer + Preferences are built-in; the optional MQTT telemetry needs this.
  knolleary/PubSubClient @ ^2.8

; ---------- OTA upload target ----------
; Flash once over USB, then upload over WiFi:
;   pio run -e esp32dev_ota -t upload
; Password must match OTA_PASSWORD in include/config.h (default 12345678).
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=12345678
